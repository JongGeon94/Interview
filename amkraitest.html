<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테스트 퀴즈</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* amkraitest 전용 — 딥글래스 (JS 클래스명 유지) */
        .quiz-container { max-width: 700px; margin: 0 auto; }
        .quiz-header {
            background: radial-gradient(130% 130% at 0% 0%, rgba(124,58,237,.35) 0%, rgba(15,23,41,0) 60%), var(--panel-solid);
            border: 1px solid var(--line); border-top: none;
            padding: 32px; border-radius: var(--radius-lg); text-align: center; margin-bottom: 24px;
        }
        .quiz-header h1 { color:#fff; margin:0 0 10px; font-size:1.7rem; font-weight:900; letter-spacing:-.5px; }
        .subtitle { color: var(--text-mid); margin:0; font-size:.95rem; }
        .quiz-item {
            background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
            padding: 22px; margin-bottom: 16px; transition: border-color .25s;
        }
        .quiz-item:hover { border-color: var(--line-strong); }
        .question { font-size:1.05rem; font-weight:700; margin-bottom:16px; line-height:1.6; color: var(--text); display:flex; align-items:baseline; flex-wrap:wrap; gap:4px; }
        .score { color:#fca5a5; font-size:.78rem; font-weight:600; margin-left:8px; background:rgba(248,113,113,.12); padding:2px 8px; border-radius:5px; border:1px solid rgba(248,113,113,.25); }
        .quiz-image { display:block; max-width:100%; max-height:250px; margin:15px 0; border-radius:8px; border:1px solid var(--line); background:rgba(255,255,255,.03); }
        .options { list-style:none; padding:0; margin:0; }
        .options li { margin-bottom:9px; }
        .options label {
            display:block; padding:12px 15px; background: var(--panel); border:1px solid var(--line);
            border-radius:8px; cursor:pointer; transition:.2s; font-size:.95rem; color: var(--text-mid);
        }
        .options label:hover { background: var(--panel-hover); border-color:rgba(96,165,250,.35); color:#bfdbfe; }
        .options input[type="radio"] { margin-right:12px; transform:scale(1.15); vertical-align:middle; accent-color: var(--brand); }
        .text-answer {
            width:100%; max-width:450px; padding:12px 15px; border:1.5px solid var(--line-strong);
            border-radius:8px; font-size:.95rem; box-sizing:border-box; transition:.2s;
            background: rgba(0,0,0,.25); color: var(--text);
        }
        .text-answer:focus { border-color: var(--brand); outline:none; box-shadow:0 0 0 3px var(--brand-soft); }
        .text-answer::placeholder { color:#5b6b85; }
        .hint { font-size:.8rem; color:#93a4c4; margin-top:8px; display:inline-block; background:rgba(59,130,246,.1); padding:6px 10px; border-radius:6px; border:1px solid rgba(59,130,246,.2); }
        .btn-submit {
            display:block; width:100%; padding:18px; border:none; border-radius:12px;
            background: linear-gradient(140deg, var(--brand), var(--brand-2)); color:#fff;
            font-size:1.1rem; font-weight:800; cursor:pointer; margin-top:32px;
            box-shadow:0 8px 22px -8px var(--brand); transition:.2s;
        }
        .btn-submit:hover { transform:translateY(-2px); }
        .result { margin-top:24px; padding:26px; border-radius:14px; text-align:center; font-size:1.4rem; font-weight:800; display:none; line-height:1.5; }
        .success { background:rgba(52,211,153,.12); color:#6ee7b7; border:1px solid rgba(52,211,153,.35); }
        .fail { background:rgba(248,113,113,.12); color:#fca5a5; border:1px solid rgba(248,113,113,.35); }
        .feedback { margin-top:15px; padding:12px 15px; border-radius:8px; font-size:.9rem; font-weight:700; display:none; }
        .feedback.correct { background:rgba(52,211,153,.1); color:#6ee7b7; border:1px solid rgba(52,211,153,.3); }
        .feedback.wrong { background:rgba(248,113,113,.1); color:#fca5a5; border:1px solid rgba(248,113,113,.3); }
        .quiz-item.item-correct { border-color:rgba(52,211,153,.5); background:rgba(52,211,153,.06); }
        .quiz-item.item-wrong { border-color:rgba(248,113,113,.5); background:rgba(248,113,113,.06); }
    </style>
</head>
<body class="theme-amkr">

<div class="quiz-container">
    <div class="quiz-header">
        <h1>📝 엠코테크놀로지코리아 AI역량검사 테스트</h1>
        <div class="subtitle">모든 문제를 풀고 최하단의 제출하기 버튼을 누르세요.</div>
    </div>
    
    <div id="resultBox" class="result"></div>

    <form id="quizForm">
        <div id="quiz-box"></div>
        <button type="button" class="btn-submit" onclick="checkAnswers()">정답 제출하기</button>
    </form>
</div>

<script>
const quizData = [
    {
        type: "text",
        question: "어느 지도에서 2cm는 실제 거리로는 4KM가 된다. 지도상에서 5cm는 실제 거리로 얼마인가?",
        hint: "💡 답변예시 : OOKM (대문자 입력 및 띄어쓰기 없이 숫자와 단위만 입력)",
        answer: "10KM"
    },
    {
        type: "text",
        question: "조립(어셈블리)를 영어로 쓰시오.",
        hint: "💡 영문 소문자로만 입력하세요. (띄어쓰기 없음)",
        answer: "assembly"
    },
    {
        type: "choice",
        question: "15 ( ) (9-6) + 4 x 3 = 17 에서 괄호 안에 들어갈 적절한 기호는?",
        options: ["+", "-", "÷", "x"],
        answer: 2
    },
    {
        type: "choice",
        question: "짝지어진 두 단어의 관계가 다른 것을 고르시오.",
        options: ["Strong – Weak", "Huge – Tiny", "Blank – Fix", "Slow – Fast"],
        answer: 2
    },
    {
        type: "text",
        question: "정리하다(어레인지)를 영어로 쓰시오.",
        hint: "💡 영문 소문자로만 입력하세요. (띄어쓰기 없음)",
        answer: "arrange"
    },
    {
        type: "text",
        question: "계산을 하시오.",
        image: "Q6.png",
        hint: "💡 숫자만 입력하세요.",
        answer: "10"
    },
    {
        type: "text",
        question: "73.862 + 33.529 - 325.793 을 계산하시오.",
        hint: "💡 마이너스 부호와 소수점을 정확히 입력하세요. ", 
        answer: "-218.402"
    },
    {
        type: "text",
        question: "전기(일렉트릭)을 영어로 쓰시오.",
        hint: "💡 영문 소문자로만 입력하세요. (띄어쓰기 없음)",
        answer: "electric"
    },
    {
        type: "text",
        question: "4 x 27 - 3 x 2 ÷ 3 을 계산하시오.",
        hint: "💡 숫자만 입력하세요.",
        answer: "106"
    },
    {
        type: "text",
        question: "품질(퀄리티)를 영어로 쓰시오.",
        hint: "💡 영문 소문자로만 입력하세요. (띄어쓰기 없음)",
        answer: "quality"
    },
    {
        type: "choice",
        question: "대화의 빈칸에 들어갈 말로 알맞은 것을 고르시오.<br><br>A : I went fishing in the East Sea<br>B : Really? ____________?<br>A : It was so much fun!",
        options: ["How was it", "Where was it", "When did you go", "Who went with you"],
        answer: 1
    },
    {
        type: "choice",
        question: "수빈이와 어머니의 나이차는 32이다. 그리고 어머니의 나이는 수빈이의 나이의 3배라면 현재 수빈이의 나이는?",
        options: ["13", "18", "14", "16"],
        answer: 3
    },
    {
        type: "text",
        question: "오류(에러)를 영어로 쓰시오.",
        hint: "💡 영문 소문자로만 입력하세요. (띄어쓰기 없음)",
        answer: "error"
    },
    {
        type: "choice",
        question: "다음 중 제시된 단어와 같거나 비슷한 뜻을 가진 것을 고르시오.<br><br><b>region</b>",
        options: ["area", "surface", "situation", "union"],
        answer: 0
    },
    {
        type: "text",
        question: "12 - 4 x 8 + 32 ÷ 4 를 계산하시오.",
        hint: "💡 숫자만 입력하세요.",
        answer: "-12"
    },
    {
        type: "text",
        question: "생산(프로덕션)을 영어로 쓰시오.",
        hint: "💡 영문 소문자로만 입력하세요. (띄어쓰기 없음)",
        answer: "production"
    },
    {
        type: "text",
        question: "영수는 100M를 뛰는데 17초가 걸린다. 희원이는 50M를 뛰는데 11초가 걸린다. 둘이 각각 150M를 나누어 뛰었을 때(총 300M), 걸리는 시간은 총 몇 초인가?",
        hint: "💡 단위 없이 소수점을 포함한 숫자만 입력하세요.",
        answer: "58.5"
    },
    {
        type: "text",
        question: "[{20 - (4 x 3) x 4} ÷ 2] + 3 을 계산하시오.",
        hint: "💡 숫자만 입력하세요.",
        answer: "-11"
    },
    {
        type: "text",
        question: "기술(테크놀로지)를 영어로 쓰시오.",
        hint: "💡 영문 소문자로만 입력하세요. (띄어쓰기 없음)",
        answer: "technology"
    },
    {
        type: "choice",
        question: "다음 분수 그림이 나타내는 수식을 계산하고, 정답에 해당하는 보기를 고르시오.",
        image: "Q20.png",
        options: ["1/2", "1/3", "1/4", "1/5"],
        answer: 0
    }
];

function renderQuiz() {
    const quizBox = document.getElementById('quiz-box');
    let html = '';

    quizData.forEach((q, index) => {
        html += `<div class="quiz-item" id="item${index}">`;
        html += `<div class="question"><span>${index + 1}. ${q.question}</span> <span class="score">5점</span></div>`;

        if (q.image) {
            html += `<img src="${q.image}" class="quiz-image" alt="${index + 1}번 문제 이미지">`;
        }

        if (q.type === "choice") {
            html += `<ul class="options">`;
            q.options.forEach((opt, optIndex) => {
                html += `
                    <li>
                        <label>
                            <input type="radio" name="question${index}" value="${optIndex}">
                            ${optIndex + 1}번. ${opt}
                        </label>
                    </li>`;
            });
            html += `</ul>`;
        } else if (q.type === "text") {
            html += `<input type="text" name="question${index}" class="text-answer" placeholder="정답을 입력하세요">`;
            if (q.hint) {
                html += `<span class="hint">${q.hint}</span>`;
            }
        }

        // 정답 피드백 영역 추가
        html += `<div class="feedback" id="feedback${index}"></div>`;
        html += `</div>`;
    });

    quizBox.innerHTML = html;
}

function checkAnswers() {
    let score = 0;
    const form = document.getElementById('quizForm');
    let unanswred = false;

    // 모든 피드백 및 카드 스타일 초기화
    quizData.forEach((q, index) => {
        const itemCard = document.getElementById(`item${index}`);
        const feedbackBox = document.getElementById(`feedback${index}`);
        itemCard.className = "quiz-item";
        feedbackBox.style.display = "none";
        feedbackBox.className = "feedback";
    });

    // 미입력 확인 확인
    quizData.forEach((q, index) => {
        if (q.type === "choice") {
            const selected = form.querySelector(`input[name="question${index}"]:checked`);
            if (!selected) unanswred = true;
        } else if (q.type === "text") {
            const typed = form.querySelector(`input[name="question${index}"]`).value.trim();
            if (!typed) unanswred = true;
        }
    });

    if (unanswred && !confirm("아직 풀지 않은 문제가 있습니다. 그대로 제출할까요?")) {
        return;
    }

    // 채점 및 결과 화면 표시
    quizData.forEach((q, index) => {
        const itemCard = document.getElementById(`item${index}`);
        const feedbackBox = document.getElementById(`feedback${index}`);
        let isCorrect = false;
        let correctAnswerText = "";

        if (q.type === "choice") {
            const selected = form.querySelector(`input[name="question${index}"]:checked`);
            correctAnswerText = `${q.answer + 1}번. ${q.options[q.answer]}`;
            
            if (selected && parseInt(selected.value) === q.answer) {
                isCorrect = true;
                score += 5;
            }
        } else if (q.type === "text") {
            const typed = form.querySelector(`input[name="question${index}"]`).value.trim();
            correctAnswerText = q.answer;
            
            if (typed.toLowerCase() === q.answer.toLowerCase()) {
                isCorrect = true;
                score += 5;
            }
        }

        // 개별 문제 결과 피드백 적용
        feedbackBox.style.display = "block";
        if (isCorrect) {
            itemCard.classList.add("item-correct");
            feedbackBox.classList.add("correct");
            feedbackBox.innerHTML = `⭕ 정답입니다!`;
        } else {
            itemCard.classList.add("item-wrong");
            feedbackBox.classList.add("wrong");
            feedbackBox.innerHTML = `❌ 틀렸습니다. (정답: <strong>${correctAnswerText}</strong>)`;
        }
    });

    // 상단 총점 알림판 갱신 및 스크롤 이동
    const resultBox = document.getElementById('resultBox');
    resultBox.style.display = "block";
    
    const totalQuestions = quizData.length * 5;
    if (score === totalQuestions) {
        resultBox.className = "result success";
        resultBox.innerHTML = `🎉 만점입니다! <br> 총점: ${score} / ${totalQuestions}점`;
    } else {
        resultBox.className = "result fail";
        resultBox.innerHTML = `👍 수고하셨습니다. 아래에서 틀린 문제를 확인하세요.<br> 총점: ${score} / ${totalQuestions}점`;
    }
    
    window.scrollTo({top: 0, behavior: 'smooth'});
}

renderQuiz();
</script>

</body>
</html>
